name: Horaris dels busos

on:
  schedule:
    - cron: "47 3 * * *"   # cada dia cap a les 4.47 / 5.47 (hora de Madrid)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: busos
  cancel-in-progress: false

jobs:
  horaris:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 13.11.2026: última còpia bona del GTFS, per si el portal de la Generalitat falla
      - name: Recupera l'última còpia bona del GTFS
        uses: actions/cache/restore@v4
        with:
          path: .gtfs/gtfs.zip
          key: gtfs-${{ github.run_id }}
          restore-keys: gtfs-

      - name: Baixa el GTFS i genera data/busos.json
        env:
          GTFS_URL: ${{ vars.GTFS_URL }}
        run: python scripts/gtfs_baix.py

      - name: Guarda la còpia del GTFS
        if: hashFiles('.gtfs/gtfs.zip') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .gtfs/gtfs.zip
          key: gtfs-${{ hashFiles('.gtfs/gtfs.zip') }}

      - name: Busca el PDF d'horaris vigent de cada línia (Moventis)
        continue-on-error: true
        run: python scripts/horaris_pdf.py

      # 01.11.2026: còpia pròpia del díptic del Clic.cat (setembre 2025), que a la web
      # oficial no es troba. Només es baixa si encara no hi és; per canviar-lo, esborra
      # data/clic-baix-emporda.pdf i posa la nova adreça aquí.
      - name: Còpia del díptic del Clic.cat
        continue-on-error: true
        run: |
          if [ ! -s data/clic-baix-emporda.pdf ]; then
            curl -fsSL -A "Mozilla/5.0 (latdg-busos)" -o data/clic-baix-emporda.pdf \
              "https://palau-sator.cat/media/sites/161/Diptic-informatiu-setembre-2025.pdf" \
              && head -c 5 data/clic-baix-emporda.pdf | grep -q "%PDF" || rm -f data/clic-baix-emporda.pdf
          fi

      - name: Desa les dades si han canviat
        run: |
          git config user.name "latdg-busos"
          git config user.email "latdg-busos@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sense canvis"
          else
            git commit -m "Horaris del $(TZ=Europe/Madrid date +%d.%m.%Y)"
            git push
          fi
